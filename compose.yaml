x-development-build: &development-build
  build:
    context: .
    target: development
  image: profound-url-summarization-development:local
  init: true

services:
  db:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: urlsum
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlsum"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    <<: *development-build
    command: ["pnpm", "--filter", "@profound/db", "migrate:dev"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlsum
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./packages/db/src:/app/packages/db/src
      - ./packages/db/drizzle:/app/packages/db/drizzle

  api:
    <<: *development-build
    command: ["pnpm", "--filter", "@profound/api", "dev"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlsum
      NODE_ENV: development
      PORT: 4311
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4311/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/contracts/src:/app/packages/contracts/src
      - ./packages/db/src:/app/packages/db/src

  web:
    <<: *development-build
    command: ["pnpm", "--filter", "@profound/web", "dev"]
    environment:
      API_PROXY_TARGET: http://api:4311
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4310:4310"
    volumes:
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./packages/contracts/src:/app/packages/contracts/src

volumes:
  postgres-data:

networks:
  # Below common VPN tunnel MTUs so forwarded container traffic is never silently dropped.
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1280"
