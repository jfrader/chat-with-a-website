x-runtime-build: &runtime-build
  build:
    context: .
    target: runtime
  image: chat-with-a-website:local
  init: true

services:
  db:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: urlsum
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlsum"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - production-postgres-data:/var/lib/postgresql/data

  migrate:
    <<: *runtime-build
    command: ["node", "node_modules/@chat-with-a-website/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlsum
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *runtime-build
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlsum
      NODE_ENV: production
      PORT: 4311
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4311:4311"

volumes:
  production-postgres-data:
