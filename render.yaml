services:
  - type: web
    name: chat-with-a-website
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-with-a-website-db
          property: connectionString
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_API_KEY
        sync: false

databases:
  - name: chat-with-a-website-db
    plan: free
    databaseName: urlsum
    user: urlsum
